[project]
name = "molkartpy"
dynamic = ["version"]
description = "Utility package for Molkart"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name="Krešimir Bestak", email="kbestak@gmail.com" }
]
keywords = ["transcriptomics", "molkart", "spatial", "omics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "pandas",
    "tifffile",
    "ome_types",
    "numpy",
    "loguru",
    "dask",
    "dask-image",
    "scikit-image",
    "scipy",
    "h5py",
    "anndata",
    "typer",
    "zarr>=3"
]
[project.urls]
Homepage = "https://github.com/nf-core/molkart"
Issues = "https://github.com/nf-core/molkart/issues"
Package = "https://github.com/schapirolabor/molkart-local"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "molkartpy.__version__"}

[project.scripts]

